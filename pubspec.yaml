name: yak_merchant_app_design_lib
description: "A new Flutter package project."
version: 1.5.0

environment:
  sdk: ^3.10.8
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # Alert icon is embedded in lib/alerts/yak_alert.dart (no asset needed).

  # Google Sans font (bundled so apps using this package get the font automatically)
  fonts:
    - family: GoogleSans
      fonts:
        - asset: fonts/GoogleSans-Regular.ttf
        - asset: fonts/GoogleSans-Italic.ttf
          style: italic
        - asset: fonts/GoogleSans-Medium.ttf
          weight: 500
        - asset: fonts/GoogleSans-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: fonts/GoogleSans-SemiBold.ttf
          weight: 600
        - asset: fonts/GoogleSans-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: fonts/GoogleSans-Bold.ttf
          weight: 700
        - asset: fonts/GoogleSans-BoldItalic.ttf
          weight: 700
          style: italic
